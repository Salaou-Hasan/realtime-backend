[package]
name = "realtime-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "realtime-backend"
path = "src/main.rs"

[dependencies]
mio = { version = "1", features = ["net", "os-ext"] }
rustc-hash = "2"
crc = "3"
serde_json = "1"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
